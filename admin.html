<script>

let usuarioActual = null;

let listaBomberos = [];

let listaUnidades = [];

let listaConductores = [];


/*
 * Aquí se guarda temporalmente
 * la fotografía ya recortada.
 */

let fotoProcesada = null;


/* ======================================
   API GET
======================================= */

async function getApi(query) {

const respuesta =
await fetch(
CONFIG.API_URL +
"?" +
query
);

return await respuesta.json();

}


/* ======================================
   SESIÓN
======================================= */

function validarAcceso() {

const sesion =
sessionStorage.getItem(
"cba_usuario"
);


if (!sesion) {

window.location.href =
"login.html";

return;

}


usuarioActual =
JSON.parse(
sesion
);


const rol =
String(
usuarioActual.rol || ""
)
.toUpperCase();


if (
rol !== "ADMIN"
) {

if (
rol === "CENTRAL"
) {

window.location.href =
"central.html";

return;

}


if (
rol === "CUARTEL"
) {

window.location.href =

"panel.html?cuartel=" +

encodeURIComponent(
usuarioActual.cuartel
);

return;

}


window.location.href =
"login.html";

return;

}


document
.getElementById(
"cargandoInicial"
)
.style.display =
"none";


document
.getElementById(
"adminView"
)
.style.display =
"block";


document
.getElementById(
"nombreUsuario"
)
.textContent =
usuarioActual.usuario;


cargarBomberos();

}


function cerrarSesion() {

sessionStorage.clear();

window.location.href =
"login.html";

}


/* ======================================
   TABS
======================================= */

function cambiarTab(tab) {

document
.querySelectorAll(".tab")
.forEach(
boton => {

boton.classList.toggle(
"active",
boton.dataset.tab === tab
);

}
);


document
.querySelectorAll(".panel")
.forEach(
panel => {

panel.classList.remove(
"active"
);

}
);


document
.getElementById(
"panel-" + tab
)
.classList.add(
"active"
);


if (
tab === "unidades"
) {

cargarUnidades();

}


if (
tab === "conductores"
) {

cargarBaseHabilitaciones();

}


if (
tab === "configuracion"
) {

cargarConfiguracion();

}

}


/* ======================================
   BOMBEROS
======================================= */

async function cargarBomberos() {

let query =
"action=adminBomberos";


const buscar =
document
.getElementById(
"buscarBombero"
)
.value
.trim();


const cuartel =
document
.getElementById(
"filtroCuartelBombero"
)
.value;


if (buscar) {

query +=

"&buscar=" +

encodeURIComponent(
buscar
);

}


if (cuartel) {

query +=

"&cuartel=" +

encodeURIComponent(
cuartel
);

}


if (
document
.getElementById(
"soloActivosBombero"
)
.checked
) {

query +=
"&soloActivos=SI";

}


const data =
await getApi(query);


listaBomberos =
data.bomberos || [];


document
.getElementById(
"tablaBomberos"
)
.innerHTML =

listaBomberos
.map(
b => `

<tr>

<td>

<img
class="foto"
src="${b.foto}"
onerror="
this.onerror=null;
this.src='${CONFIG.FOTO_DEFAULT}'
"
>

</td>

<td>
${b.registro}
</td>

<td>

<strong>
${b.nombre}
</strong>

<br>

<small>
${b.rut}
</small>

</td>

<td>
${b.cargo || ""}
</td>

<td>

${

CONFIG.CUARTELES[
b.cuartel
]

||

b.cuartel

}

</td>

<td>

<span
class="
badge
${String(b.activo).toUpperCase()==='SI'?'ok':'no'}
"
>

${String(b.activo).toUpperCase()==='SI'?'Activo':'Inactivo'}

</span>

</td>

<td>

${

String(
b.esCuartelero
).toUpperCase() ===
"SI"

?

'<span class="badge info">Sí</span>'

:

'No'

}

</td>

<td>

<button
class="btn btn-light"
onclick="editarBombero('${b.registro}')"
>
Editar
</button>

</td>

</tr>

`
)
.join("");

}


/* ======================================
   EDITAR BOMBERO
======================================= */

function editarBombero(
registro
) {

const bombero =
listaBomberos.find(

b =>
String(b.registro) ===
String(registro)

);


if (!bombero) {
return;
}


/*
 * Reiniciar fotografía pendiente.
 */

fotoProcesada =
null;


document
.getElementById(
"inputFoto"
)
.value =
"";


document
.getElementById(
"previewFoto"
)
.src =

bombero.foto ||

CONFIG.FOTO_DEFAULT;


document
.getElementById(
"editRegistro"
)
.value =
bombero.registro;


document
.getElementById(
"editRut"
)
.value =
bombero.rut || "";


document
.getElementById(
"editNombre"
)
.value =
bombero.nombre || "";


document
.getElementById(
"editCargo"
)
.value =
bombero.cargo || "";


document
.getElementById(
"editCuartel"
)
.value =
bombero.cuartel;


document
.getElementById(
"editActivo"
)
.value =

String(
bombero.activo
).toUpperCase() ===
"NO"

?

"NO"

:

"SI";


document
.getElementById(
"editCuartelero"
)
.value =

String(
bombero.esCuartelero
).toUpperCase() ===
"SI"

?

"SI"

:

"NO";


document
.getElementById(
"msgBombero"
)
.textContent =
"";


abrirModal(
"modalBombero"
);

}


/* ======================================
   PROCESAR FOTO
======================================= */

function procesarFoto(event) {

const archivo =
event.target.files[0];


if (!archivo) {
return;
}


if (
!archivo.type.startsWith(
"image/"
)
) {

alert(
"Selecciona una imagen válida."
);

return;

}


const lector =
new FileReader();


lector.onload =
function(e) {


const imagen =
new Image();


imagen.onload =
function() {


/*
 * Calculamos el cuadrado más grande
 * posible desde el centro.
 */

const lado =
Math.min(
imagen.width,
imagen.height
);


const origenX =
(
imagen.width -
lado
) / 2;


const origenY =
(
imagen.height -
lado
) / 2;


/*
 * Canvas final de 600 x 600.
 */

const canvas =
document.createElement(
"canvas"
);


canvas.width =
600;


canvas.height =
600;


const ctx =
canvas.getContext(
"2d"
);


ctx.drawImage(

imagen,

origenX,
origenY,
lado,
lado,

0,
0,
600,
600

);


/*
 * JPG con 85 % de calidad.
 */

fotoProcesada =
canvas.toDataURL(
"image/jpeg",
0.85
);


document
.getElementById(
"previewFoto"
)
.src =
fotoProcesada;

};


imagen.src =
e.target.result;

};


lector.readAsDataURL(
archivo
);

}


/* ======================================
   GUARDAR BOMBERO
======================================= */

async function guardarBombero() {

const boton =
document
.getElementById(
"btnGuardarBombero"
);


const mensaje =
document
.getElementById(
"msgBombero"
);


boton.disabled =
true;


mensaje.textContent =
"Guardando datos...";


const registro =
document
.getElementById(
"editRegistro"
)
.value;


try {


/*
 * 1. Guardar datos del bombero.
 */

const params =
new URLSearchParams({

action:
"actualizarBombero",

registro,

rut:
document
.getElementById(
"editRut"
)
.value
.trim(),

nombre:
document
.getElementById(
"editNombre"
)
.value
.trim(),

cargo:
document
.getElementById(
"editCargo"
)
.value
.trim(),

cuartel:
document
.getElementById(
"editCuartel"
)
.value,

activo:
document
.getElementById(
"editActivo"
)
.value,

esCuartelero:
document
.getElementById(
"editCuartelero"
)
.value

});


const resultado =
await getApi(
params.toString()
);


if (!resultado.ok) {

mensaje.textContent =
resultado.mensaje;

boton.disabled =
false;

return;

}


/*
 * 2. Si seleccionamos una nueva foto,
 * subirla a Drive.
 */

if (
fotoProcesada
) {


mensaje.textContent =
"Subiendo fotografía...";


const respuestaFoto =
await fetch(

CONFIG.API_URL,

{

method:
"POST",

headers: {

"Content-Type":

/* ======================================
   UNIDADES
======================================= */

async function cargarUnidades() {

const data =
await getApi(
"action=adminUnidades"
);


listaUnidades =
data.unidades || [];


document
.getElementById(
"listaUnidades"
)
.innerHTML =

listaUnidades
.map(
u => `

<div class="unidad-card">

<h3>
${u.unidad}
</h3>

<p>
${CONFIG.CUARTELES[u.cuartel] || u.cuartel}
</p>

<p>
Estado:
<strong>
${u.estado}
</strong>
</p>

<p>
Principal:
${u.principalNombre || "-"}
</p>

<p>
Secundario:
${u.secundarioNombre || "-"}
</p>

<button
class="btn btn-light"
onclick="editarUnidad('${u.unidad}')"
>
Editar
</button>

</div>

`
)
.join("");

}


function abrirUnidadNueva() {

document
.getElementById(
"unidadOriginal"
)
.value =
"";


document
.getElementById(
"unidadNombre"
)
.value =
"";


document
.getElementById(
"tituloModalUnidad"
)
.textContent =
"Nueva unidad";


abrirModal(
"modalUnidad"
);

}


function editarUnidad(
nombre
) {

const u =
listaUnidades.find(
x =>
x.unidad === nombre
);


document
.getElementById(
"unidadOriginal"
)
.value =
u.unidad;


document
.getElementById(
"unidadNombre"
)
.value =
u.unidad;


document
.getElementById(
"unidadCuartel"
)
.value =
u.cuartel;


document
.getElementById(
"unidadEstado"
)
.value =
u.estado;


document
.getElementById(
"unidadActiva"
)
.value =
u.activa;


document
.getElementById(
"unidadObservacion"
)
.value =
u.observacion || "";


abrirModal(
"modalUnidad"
);

}


async function guardarUnidad() {

const params =
new URLSearchParams({

action:
"guardarUnidad",

unidadOriginal:
document
.getElementById(
"unidadOriginal"
)
.value,

unidad:
document
.getElementById(
"unidadNombre"
)
.value,

cuartel:
document
.getElementById(
"unidadCuartel"
)
.value,

estado:
document
.getElementById(
"unidadEstado"
)
.value,

activa:
document
.getElementById(
"unidadActiva"
)
.value,

observacion:
document
.getElementById(
"unidadObservacion"
)
.value

});


const data =
await getApi(
params.toString()
);


if (
data.ok
) {

cerrarModal(
"modalUnidad"
);

cargarUnidades();

}

}


/* ======================================
   CONDUCTORES
======================================= */

async function cargarBaseHabilitaciones() {

const data =
await getApi(
"action=adminHabilitaciones"
);


listaConductores =
data.bomberos || [];


document
.getElementById(
"selectConductor"
)
.innerHTML =

'<option value="">Seleccione...</option>' +

listaConductores
.map(
b => `

<option value="${b.registro}">

${b.nombre}
—
${b.registro}

</option>

`
)
.join("");

}


async function cargarHabilitacionesSeleccionado() {

const registro =
document
.getElementById(
"selectConductor"
)
.value;


if (!registro) {
return;
}


const data =
await getApi(

"action=adminHabilitaciones" +

"&registro=" +

encodeURIComponent(
registro
)

);


const habilitadas =
new Set(
data.habilitadas || []
);


document
.getElementById(
"checksUnidades"
)
.innerHTML =

(data.unidades || [])
.map(
u => `

<div class="check-unidad">

<label>

<input
type="checkbox"
class="unidadCheck"
value="${u.unidad}"
${habilitadas.has(u.unidad)?'checked':''}
>

${u.unidad}

</label>

</div>

`
)
.join("");

}


async function guardarHabilitaciones() {

const registro =
document
.getElementById(
"selectConductor"
)
.value;


const unidades =

Array.from(
document.querySelectorAll(
".unidadCheck:checked"
)
)
.map(
x =>
x.value
);


const params =
new URLSearchParams({

action:
"guardarHabilitaciones",

registro,

unidades:
unidades.join(",")

});


const data =
await getApi(
params.toString()
);


alert(
data.mensaje
);

}


/* ======================================
   CONFIG
======================================= */

async function cargarConfiguracion() {

const data =
await getApi(
"action=adminConfiguracion"
);


document
.getElementById(
"listaConfiguracion"
)
.innerHTML =

(data.configuracion || [])
.map(
(c,i) => `

<div class="config-card">

<strong>
${c.clave}
</strong>

<br><br>

<input
id="config-${i}"
value="${c.valor}"
>

<br><br>

<button
class="btn btn-primary"
onclick="guardarConfig('${c.clave}','config-${i}')"
>
Guardar
</button>

</div>

`
)
.join("");

}


async function guardarConfig(
clave,
id
) {

const params =
new URLSearchParams({

action:
"guardarConfiguracion",

clave,

valor:
document
.getElementById(id)
.value

});


const data =
await getApi(
params.toString()
);


alert(
data.mensaje
);

}


async function agregarConfiguracion() {

const clave =
prompt(
"Clave:"
);


if (!clave) {
return;
}


const valor =
prompt(
"Valor:"
) || "";


const params =
new URLSearchParams({

action:
"guardarConfiguracion",

clave,

valor

});


await getApi(
params.toString()
);


cargarConfiguracion();

}


/* ======================================
   MODALES
======================================= */

function abrirModal(
id
) {

document
.getElementById(id)
.style.display =
"flex";

}


function cerrarModal(
id
) {

document
.getElementById(id)
.style.display =
"none";

}


/* ======================================
   INICIO
======================================= */

window.addEventListener(
"DOMContentLoaded",
validarAcceso
);

</script>
