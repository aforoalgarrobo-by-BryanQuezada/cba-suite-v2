<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>CBA Suite - Administración</title>

  <style>

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      background: #f3f4f6;
      color: #1f2937;
    }

    button,
    input,
    select,
    textarea {
      font: inherit;
    }

    /* ===============================
       LOGIN
    =============================== */

    #loginView {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .login-box {
      width: 100%;
      max-width: 420px;
      background: white;
      border-radius: 16px;
      padding: 30px;
      box-shadow: 0 10px 30px rgba(0,0,0,.12);
    }

    .login-box h1 {
      margin: 0;
      text-align: center;
    }

    .login-box p {
      text-align: center;
      color: #6b7280;
    }

    .campo {
      margin-bottom: 15px;
    }

    .campo label {
      display: block;
      font-weight: bold;
      margin-bottom: 6px;
    }

    .campo input,
    .campo select,
    .campo textarea {
      width: 100%;
      padding: 11px;
      border: 1px solid #d1d5db;
      border-radius: 8px;
    }

    .btn {
      border: none;
      border-radius: 8px;
      padding: 10px 16px;
      cursor: pointer;
    }

    .btn-primary {
      background: #2563eb;
      color: white;
    }

    .btn-dark {
      background: #111827;
      color: white;
    }

    .btn-light {
      background: #e5e7eb;
      color: #111827;
    }

    .btn-block {
      width: 100%;
    }

    .mensaje {
      min-height: 20px;
      margin-top: 12px;
      text-align: center;
    }

    /* ===============================
       ADMIN
    =============================== */

    #adminView {
      display: none;
    }

    .topbar {
      min-height: 70px;
      background: #111827;
      color: white;
      padding: 12px 24px;

      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 20px;
    }

    .topbar h1 {
      margin: 0;
      font-size: 22px;
    }

    .top-actions {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .usuario {
      text-align: right;
      font-size: 13px;
    }

    .usuario span {
      display: block;
      opacity: .7;
    }

    /* ===============================
       TABS
    =============================== */

    .tabs {
      display: flex;
      gap: 8px;
      padding: 12px 24px;
      background: white;
      border-bottom: 1px solid #e5e7eb;
      overflow-x: auto;
    }

    .tab {
      border: none;
      background: transparent;
      padding: 10px 15px;
      border-radius: 8px;
      cursor: pointer;
      white-space: nowrap;
    }

    .tab.active {
      background: #111827;
      color: white;
    }

    /* ===============================
       CONTENIDO
    =============================== */

    .container {
      max-width: 1400px;
      margin: auto;
      padding: 24px;
    }

    .panel {
      display: none;
    }

    .panel.active {
      display: block;
    }

    .panel h2 {
      margin-top: 0;
    }

    .toolbar {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;

      background: white;
      padding: 15px;
      border-radius: 12px;
      margin-bottom: 16px;
    }

    .toolbar input,
    .toolbar select {
      padding: 10px;
      border: 1px solid #d1d5db;
      border-radius: 7px;
    }

    .toolbar .grow {
      flex: 1;
      min-width: 240px;
    }

    .card {
      background: white;
      border-radius: 12px;
      padding: 16px;
      box-shadow: 0 2px 8px rgba(0,0,0,.05);
    }

    /* ===============================
       TABLA BOMBEROS
    =============================== */

    .tabla {
      overflow-x: auto;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      min-width: 900px;
    }

    th,
    td {
      padding: 11px 12px;
      border-bottom: 1px solid #e5e7eb;
      text-align: left;
      font-size: 14px;
    }

    th {
      background: #f9fafb;
    }

    .foto {
      width: 42px;
      height: 42px;
      border-radius: 50%;
      object-fit: cover;
      background: #ddd;
    }

    .small {
      color: #6b7280;
      font-size: 12px;
    }

    .badge {
      display: inline-block;
      padding: 4px 8px;
      border-radius: 999px;
      font-size: 12px;
    }

    .ok {
      background: #dcfce7;
      color: #166534;
    }

    .no {
      background: #fee2e2;
      color: #991b1b;
    }

    .info {
      background: #dbeafe;
      color: #1e40af;
    }

    /* ===============================
       GRID
    =============================== */

    .grid {
      display: grid;
      grid-template-columns:
        repeat(auto-fit, minmax(220px, 1fr));
      gap: 14px;
    }

    .unidad-card,
    .config-card {
      background: white;
      border: 1px solid #e5e7eb;
      border-radius: 10px;
      padding: 14px;
    }

    .unidad-card h3 {
      margin: 0 0 8px;
      font-size: 24px;
    }

    .unidad-card .dato {
      margin: 5px 0;
    }

    /* ===============================
       CONDUCTORES
    =============================== */

    .select-persona {
      width: 100%;
      padding: 11px;
      border: 1px solid #d1d5db;
      border-radius: 8px;
      margin-top: 8px;
      margin-bottom: 15px;
    }

    .checks {
      display: grid;
      grid-template-columns:
        repeat(auto-fit, minmax(180px,1fr));
      gap: 10px;
      margin-top: 15px;
    }

    .check-unidad {
      border: 1px solid #d1d5db;
      border-radius: 9px;
      padding: 11px;
      background: white;
    }

    .check-unidad label {
      display: flex;
      align-items: center;
      gap: 9px;
      cursor: pointer;
    }

    .check-unidad input {
      width: 20px;
      height: 20px;
    }

    /* ===============================
       CONFIG
    =============================== */

    .config-card strong {
      display: block;
      margin-bottom: 8px;
    }

    .config-card input {
      width: 100%;
      padding: 9px;
      border: 1px solid #d1d5db;
      border-radius: 7px;
      margin-bottom: 10px;
    }

    /* ===============================
       MODALES
    =============================== */

    .modal-bg {
      display: none;
      position: fixed;
      inset: 0;
      z-index: 1000;

      background: rgba(0,0,0,.55);

      align-items: center;
      justify-content: center;

      padding: 20px;
    }

    .modal {
      width: 100%;
      max-width: 560px;

      background: white;
      border-radius: 14px;
      padding: 22px;

      max-height: 90vh;
      overflow-y: auto;
    }

    .modal h2 {
      margin-top: 0;
    }

    .modal-actions {
      display: flex;
      justify-content: flex-end;
      gap: 10px;
      margin-top: 18px;
    }

    @media (max-width:700px) {

      .container {
        padding: 14px;
      }

      .tabs {
        padding: 10px 12px;
      }

      .usuario {
        display: none;
      }

      .toolbar > * {
        width: 100%;
      }

    }

  </style>

</head>


<body>

<!-- ==========================================
     LOGIN
=========================================== -->

<div id="loginView">

  <div class="login-box">

    <h1>CBA Suite</h1>

    <p>Administración</p>

    <form onsubmit="iniciarSesion(event)">

      <div class="campo">

        <label>Usuario</label>

        <input
          id="usuario"
          autocomplete="username"
          required
        >

      </div>

      <div class="campo">

        <label>Contraseña</label>

        <input
          id="clave"
          type="password"
          autocomplete="current-password"
          required
        >

      </div>

      <button
        id="btnLogin"
        class="btn btn-dark btn-block"
        type="submit"
      >
        Ingresar
      </button>

      <div
        id="loginMensaje"
        class="mensaje"
      ></div>

    </form>

  </div>

</div>


<!-- ==========================================
     ADMIN
=========================================== -->

<div id="adminView">

  <header class="topbar">

    <h1>CBA Suite — Administración</h1>

    <div class="top-actions">

      <div class="usuario">

        <strong id="nombreUsuario"></strong>

        <span id="rolUsuario"></span>

      </div>

      <button
        class="btn btn-light"
        onclick="cerrarSesion()"
      >
        Salir
      </button>

    </div>

  </header>


  <!-- TABS -->

  <nav class="tabs">

    <button
      class="tab active"
      data-tab="bomberos"
      onclick="cambiarTab('bomberos')"
    >
      Bomberos
    </button>

    <button
      class="tab"
      data-tab="unidades"
      onclick="cambiarTab('unidades')"
    >
      Unidades
    </button>

    <button
      class="tab"
      data-tab="conductores"
      onclick="cambiarTab('conductores')"
    >
      Conductores
    </button>

    <button
      class="tab"
      data-tab="configuracion"
      onclick="cambiarTab('configuracion')"
    >
      Configuración
    </button>

  </nav>


  <main class="container">


    <!-- ====================================
         BOMBEROS
    ===================================== -->

    <section
      id="panel-bomberos"
      class="panel active"
    >

      <h2>Bomberos</h2>

      <div class="toolbar">

        <input
          id="buscarBombero"
          class="grow"
          placeholder="Nombre, RUT o registro..."
          onkeyup="if(event.key==='Enter') cargarBomberos()"
        >

        <select id="filtroCuartelBombero">

          <option value="">
            Todos los cuarteles
          </option>

          <option value="1">
            1ª Compañía
          </option>

          <option value="2">
            2ª Compañía
          </option>

          <option value="3">
            3ª Compañía
          </option>

          <option value="general">
            Cuartel General
          </option>

        </select>

        <label>

          <input
            id="soloActivosBombero"
            type="checkbox"
          >

          Solo activos

        </label>

        <button
          class="btn btn-primary"
          onclick="cargarBomberos()"
        >
          Buscar
        </button>

      </div>


      <div class="card tabla">

        <table>

          <thead>

            <tr>

              <th>Foto</th>

              <th>Registro</th>

              <th>Bombero</th>

              <th>Cargo</th>

              <th>Cuartel</th>

              <th>Activo</th>

              <th>Cuartelero</th>

              <th></th>

            </tr>

          </thead>

          <tbody id="tablaBomberos"></tbody>

        </table>

      </div>

    </section>


    <!-- ====================================
         UNIDADES
    ===================================== -->

    <section
      id="panel-unidades"
      class="panel"
    >

      <h2>Unidades</h2>

      <div class="toolbar">

        <button
          class="btn btn-primary"
          onclick="abrirUnidadNueva()"
        >
          + Nueva unidad
        </button>

        <button
          class="btn btn-light"
          onclick="cargarUnidades()"
        >
          Actualizar
        </button>

      </div>

      <div
        id="listaUnidades"
        class="grid"
      ></div>

    </section>


    <!-- ====================================
         CONDUCTORES
    ===================================== -->

    <section
      id="panel-conductores"
      class="panel"
    >

      <h2>Habilitaciones de conductores</h2>

      <div class="card">

        <label>
          <strong>Selecciona un bombero</strong>
        </label>

        <select
          id="selectConductor"
          class="select-persona"
          onchange="cargarHabilitacionesSeleccionado()"
        >
        </select>

        <div
          id="datosConductor"
          class="small"
        ></div>

        <div
          id="checksUnidades"
          class="checks"
        ></div>

        <div style="margin-top:18px;">

          <button
            class="btn btn-primary"
            onclick="guardarHabilitaciones()"
          >
            Guardar habilitaciones
          </button>

        </div>

      </div>

    </section>


    <!-- ====================================
         CONFIGURACIÓN
    ===================================== -->

    <section
      id="panel-configuracion"
      class="panel"
    >

      <h2>Configuración</h2>

      <div class="toolbar">

        <button
          class="btn btn-primary"
          onclick="agregarConfiguracion()"
        >
          + Nueva configuración
        </button>

        <button
          class="btn btn-light"
          onclick="cargarConfiguracion()"
        >
          Actualizar
        </button>

      </div>

      <div
        id="listaConfiguracion"
        class="grid"
      ></div>

    </section>

  </main>

</div>


<!-- ==========================================
     MODAL BOMBERO
=========================================== -->

<div
  id="modalBombero"
  class="modal-bg"
>

  <div class="modal">

    <h2>Editar bombero</h2>

    <div class="campo">

      <label>Registro</label>

      <input
        id="editRegistro"
        disabled
      >

    </div>

    <div class="campo">

      <label>RUT</label>

      <input id="editRut">

    </div>

    <div class="campo">

      <label>Nombre completo</label>

      <input id="editNombre">

    </div>

    <div class="campo">

      <label>Cargo</label>

      <input id="editCargo">

    </div>

    <div class="campo">

      <label>Cuartel</label>

      <select id="editCuartel">

        <option value="1">
          1ª Compañía
        </option>

        <option value="2">
          2ª Compañía
        </option>

        <option value="3">
          3ª Compañía
        </option>

        <option value="general">
          Cuartel General
        </option>

      </select>

    </div>

    <div class="campo">

      <label>Activo</label>

      <select id="editActivo">

        <option value="SI">
          Sí
        </option>

        <option value="NO">
          No
        </option>

      </select>

    </div>

    <div class="campo">

      <label>¿Es cuartelero?</label>

      <select id="editCuartelero">

        <option value="NO">
          No
        </option>

        <option value="SI">
          Sí
        </option>

      </select>

    </div>

    <div
      id="msgBombero"
      class="mensaje"
    ></div>

    <div class="modal-actions">

      <button
        class="btn btn-light"
        onclick="cerrarModal('modalBombero')"
      >
        Cancelar
      </button>

      <button
        class="btn btn-primary"
        onclick="guardarBombero()"
      >
        Guardar
      </button>

    </div>

  </div>

</div>


<!-- ==========================================
     MODAL UNIDAD
=========================================== -->

<div
  id="modalUnidad"
  class="modal-bg"
>

  <div class="modal">

    <h2 id="tituloModalUnidad">
      Unidad
    </h2>

    <input
      id="unidadOriginal"
      type="hidden"
    >

    <div class="campo">

      <label>
        Identificador de unidad
      </label>

      <input
        id="unidadNombre"
        placeholder="Ej: B-2"
      >

    </div>

    <div class="campo">

      <label>Cuartel</label>

      <select id="unidadCuartel">

        <option value="1">
          1ª Compañía
        </option>

        <option value="2">
          2ª Compañía
        </option>

        <option value="3">
          3ª Compañía
        </option>

        <option value="general">
          Cuartel General
        </option>

      </select>

    </div>

    <div class="campo">

      <label>Estado</label>

      <select id="unidadEstado">

        <option value="Sin conductor">
          Sin conductor
        </option>

        <option value="Disponible">
          Disponible
        </option>

        <option value="Fuera de servicio">
          Fuera de servicio
        </option>

      </select>

    </div>

    <div class="campo">

      <label>Activa</label>

      <select id="unidadActiva">

        <option value="SI">
          Sí
        </option>

        <option value="NO">
          No
        </option>

      </select>

    </div>

    <div class="campo">

      <label>Observación</label>

      <textarea
        id="unidadObservacion"
        rows="3"
      ></textarea>

    </div>

    <div
      id="msgUnidad"
      class="mensaje"
    ></div>

    <div class="modal-actions">

      <button
        class="btn btn-light"
        onclick="cerrarModal('modalUnidad')"
      >
        Cancelar
      </button>

      <button
        class="btn btn-primary"
        onclick="guardarUnidad()"
      >
        Guardar
      </button>

    </div>

  </div>

</div>


<script src="js/config.js"></script>


<script>

let usuarioActual = null;

let listaBomberos = [];

let listaUnidades = [];

let listaConductores = [];


/* ==========================================
   API
=========================================== */

async function getApi(query) {

  const respuesta =
    await fetch(
      CONFIG.API_URL + "?" + query
    );

  return await respuesta.json();

}


/* ==========================================
   UTILIDADES
=========================================== */

function esc(valor) {

  return String(
    valor ?? ""
  )
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;");

}


function nombreCuartel(cuartel) {

  return (
    CONFIG.CUARTELES[cuartel] ||
    cuartel ||
    "-"
  );

}


function abrirModal(id) {

  document
    .getElementById(id)
    .style.display =
    "flex";

}


function cerrarModal(id) {

  document
    .getElementById(id)
    .style.display =
    "none";

}


/* ==========================================
   LOGIN
=========================================== */

async function iniciarSesion(event) {

  event.preventDefault();


  const usuario =
    document
      .getElementById("usuario")
      .value
      .trim();


  const clave =
    document
      .getElementById("clave")
      .value
      .trim();


  const msg =
    document
      .getElementById("loginMensaje");


  msg.textContent =
    "Validando...";


  try {

    const data =
      await getApi(

        "action=login" +

        "&usuario=" +
        encodeURIComponent(usuario) +

        "&clave=" +
        encodeURIComponent(clave)

      );


    if (!data.ok) {

      msg.textContent =
        data.mensaje ||
        "Acceso rechazado";

      return;

    }


    if (
      String(data.rol)
        .toUpperCase() !==
      "ADMIN"
    ) {

      msg.textContent =
        "Sin permisos de administración";

      return;

    }


    usuarioActual = {

      usuario:
        data.usuario,

      rol:
        data.rol,

      cuartel:
        data.cuartel

    };


    sessionStorage.setItem(

      "cba_admin",

      JSON.stringify(
        usuarioActual
      )

    );


    mostrarAdmin();


  } catch (error) {

    console.error(error);

    msg.textContent =
      "Error de conexión";

  }

}


/* ==========================================
   MOSTRAR ADMIN
=========================================== */

function mostrarAdmin() {

  document
    .getElementById("loginView")
    .style.display =
    "none";


  document
    .getElementById("adminView")
    .style.display =
    "block";


  document
    .getElementById("nombreUsuario")
    .textContent =
    usuarioActual.usuario;


  document
    .getElementById("rolUsuario")
    .textContent =
    usuarioActual.rol;


  cargarBomberos();

}


function cerrarSesion() {

  sessionStorage.removeItem(
    "cba_admin"
  );

  location.reload();

}


/* ==========================================
   TABS
=========================================== */

function cambiarTab(tab) {

  document
    .querySelectorAll(".tab")
    .forEach(btn => {

      btn.classList.toggle(
        "active",
        btn.dataset.tab === tab
      );

    });


  document
    .querySelectorAll(".panel")
    .forEach(panel => {

      panel.classList.remove(
        "active"
      );

    });


  document
    .getElementById(
      "panel-" + tab
    )
    .classList.add(
      "active"
    );


  if (tab === "unidades") {

    cargarUnidades();

  }


  if (tab === "conductores") {

    cargarBaseHabilitaciones();

  }


  if (tab === "configuracion") {

    cargarConfiguracion();

  }

}


/* ==========================================
   BOMBEROS
=========================================== */

async function cargarBomberos() {

  let query =
    "action=adminBomberos";


  const buscar =
    document
      .getElementById(
        "buscarBombero"
      )
      .value
      .trim();


  const cuartel =
    document
      .getElementById(
        "filtroCuartelBombero"
      )
      .value;


  const soloActivos =
    document
      .getElementById(
        "soloActivosBombero"
      )
      .checked;


  if (buscar) {

    query +=

      "&buscar=" +

      encodeURIComponent(
        buscar
      );

  }


  if (cuartel) {

    query +=

      "&cuartel=" +

      encodeURIComponent(
        cuartel
      );

  }


  if (soloActivos) {

    query +=
      "&soloActivos=SI";

  }


  try {

    const data =
      await getApi(query);


    if (!data.ok) {

      alert(
        data.mensaje ||
        "No fue posible cargar bomberos"
      );

      return;

    }


    listaBomberos =
      data.bomberos || [];


    const tbody =
      document
        .getElementById(
          "tablaBomberos"
        );


    tbody.innerHTML =
      listaBomberos.map(
        bombero => {


          const activo =

            String(
              bombero.activo
            )
              .trim()
              .toUpperCase() ===
            "SI";


          const cuartelero =

            String(
              bombero.esCuartelero
            )
              .trim()
              .toUpperCase() ===
            "SI";


          const foto =

            bombero.foto ||

            CONFIG.FOTO_DEFAULT;


          return `

            <tr>

              <td>

                <img
                  class="foto"
                  src="${esc(foto)}"
                  onerror="
                    this.onerror=null;
                    this.src='${CONFIG.FOTO_DEFAULT}'
                  "
                >

              </td>

              <td>
                ${esc(bombero.registro)}
              </td>

              <td>

                <strong>
                  ${esc(bombero.nombre)}

async function cargarBaseHabilitaciones() {

  try {

    const data =
      await getApi(
        "action=adminHabilitaciones"
      );


    if (!data.ok) {

      alert(
        data.mensaje ||
        "Error cargando conductores"
      );

      return;

    }


    listaConductores =
      data.bomberos || [];


    const select =
      document
        .getElementById(
          "selectConductor"
        );


    select.innerHTML =

      '<option value="">Seleccione un bombero...</option>' +

        bombero => `

          <option value="${esc(
            bombero.registro
          )}">

            ${esc(bombero.nombre)}
            —

          </option>

        `
      )
      .join("");


    document
      .getElementById(
        "checksUnidades"
      )
      .innerHTML =

      .getElementById(

      )

  } catch (error) {

    alert(
      "Error cargando conductores"
    );

  }

}


async function cargarHabilitacionesSeleccionado() {

  const registro =
    document
      .getElementById(
        "selectConductor"
      )
      .value;


  if (!registro) {

    document
      .getElementById(
        "checksUnidades"
      )
      .innerHTML =
      "";

    return;

  }


  const data =
    await getApi(

      "action=adminHabilitaciones" +

      "&registro=" +

      encodeURIComponent(
        registro
      )

    );


  if (!data.ok) {

    alert(
      data.mensaje ||
      "No fue posible cargar habilitaciones"
    );

    return;

  }


  const habilitadas =
    new Set(
      (data.habilitadas || [])
        .map(String)
    );


  const bombero =
    listaConductores.find(

      b =>
        String(b.registro) ===
        String(registro)

    );


  document
    .getElementById(
      "datosConductor"
    )
    .textContent =

    bombero

      ? (
        (bombero.cargo || "Bombero") +

        " · " +

        nombreCuartel(
          bombero.cuartel
        )
      )

      : "";


  document
    .getElementById(
      "checksUnidades"
    )
    .innerHTML =

    (data.unidades || [])
      .map(
        unidad => `

          <div class="check-unidad">

            <label>

              <input
                class="unidadCheck"
                type="checkbox"
                value="${esc(
                  unidad.unidad
                )}"
                ${
                  habilitadas.has(
                    String(
                      unidad.unidad
                    )
                  )
                    ? "checked"
                    : ""
                }
              >

              <span>

                <strong>
                  ${esc(unidad.unidad)}
                </strong>

                <br>

                <span class="small">

                  ${esc(
                    nombreCuartel(
                      unidad.cuartel
                    )
                  )}

                </span>

              </span>

            </label>

          </div>

        `
      )
      .join("");

}


async function guardarHabilitaciones() {

  const registro =
    document
      .getElementById(
        "selectConductor"
      )
      .value;


  if (!registro) {

    alert(
      "Selecciona un bombero"
    );

    return;

  }


  const unidades =

    Array
      .from(
        document.querySelectorAll(
          ".unidadCheck:checked"
        )
      )
      .map(
        input =>
          input.value
      );


  const params =
    new URLSearchParams({

      action:
        "guardarHabilitaciones",

      registro,

      unidades:
        unidades.join(",")

    });


  const data =
    await getApi(
      params.toString()
    );


  alert(
    data.mensaje || ""
  );


  if (data.ok) {

    cargarHabilitacionesSeleccionado();

  }

}

async function cargarConfiguracion() {

  try {

    const data =
      await getApi(
        "action=adminConfiguracion"
      );


    if (!data.ok) {

      alert(
        data.mensaje ||
        "Error cargando configuración"
      );

      return;

    }


    document
      .getElementById(
        "listaConfiguracion"
      )
      .innerHTML =

      (data.configuracion || [])
        .map(
          (config, indice) => `

            <div class="config-card">

              <strong>
                ${esc(config.clave)}
              </strong>

              <input
                id="config-${indice}"
                value="${esc(
                  config.valor
                )}"
              >

              <button
                class="btn btn-primary"
                onclick="
                  guardarConfig(
                    '${esc(config.clave)}',
                    'config-${indice}'
                  )
                "
              >
                Guardar
              </button>

            </div>

          `
        )
        .join("");


  } catch (error) {

    console.error(error);

    alert(
      "Error cargando configuración"
    );

  }

}


async function guardarConfig(
  clave,
  inputId
) {

  const valor =
    document
      .getElementById(
        inputId
      )
      .value;


  const params =
    new URLSearchParams({

      action:
        "guardarConfiguracion",

      clave,

      valor

    });


  const data =
    await getApi(
      params.toString()
    );


  alert(
    data.mensaje || ""
  );

}


async function agregarConfiguracion() {

  const clave =
    prompt(
      "Nueva clave de configuración:"
    );


  if (!clave) {
    return;
  }


  const valor =
    prompt(
      "Valor inicial:"
    ) ?? "";


  const params =
    new URLSearchParams({

      action:
        "guardarConfiguracion",

      clave,

      valor

    });


  const data =
    await getApi(
      params.toString()
    );


  alert(
    data.mensaje || ""
  );


  if (data.ok) {

    cargarConfiguracion();

  }

}


/* ==========================================
   RECUPERAR SESIÓN
=========================================== */

window.addEventListener(
  "DOMContentLoaded",
  () => {

    const sesion =
      sessionStorage.getItem(
        "cba_admin"
      );


    if (!sesion) {
      return;
    }


    try {

      usuarioActual =
        JSON.parse(
          sesion
        );


      if (
        String(
          usuarioActual.rol
        )
          .toUpperCase() ===
        "ADMIN"
      ) {

        mostrarAdmin();

      }


    } catch (error) {

      sessionStorage.removeItem(
        "cba_admin"
      );

    }

  }
);


/* ==========================================
   CERRAR MODAL AL TOCAR FONDO
=========================================== */

document
  .querySelectorAll(
    ".modal-bg"
  )
  .forEach(
    modal => {

      modal.addEventListener(
        "click",
        event => {

          if (
            event.target === modal
          ) {

            modal.style.display =
              "none";

          }

        }
      );

    }
  );
